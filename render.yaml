# نشر منصة وسطاء إزدان على Render (الخطة المجانية)
# الخطوات بالتفصيل في DEPLOY.md
services:
  - type: web
    name: azdan-brokers
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        value: https://hbaxufkdfufcetsyghny.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: broker-documents
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: إدارة إزدان
      - key: SEED_DEMO
        value: "1"
